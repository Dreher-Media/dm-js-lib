# Keeps the SHA-pinned actions in .github/workflows current. Dependabot
# updates the SHA and the version comment next to it together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - '*'
