name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-pr-title:
    # Lint the PR title against Conventional Commits. Because PRs are squash-merged,
    # the PR title becomes the commit on the integration branch and is what
    # release-please reads. Malformed titles break the release pipeline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build
