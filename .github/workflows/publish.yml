name: Publish

# Publishes one release tag to npm through npm trusted publishing (OIDC),
# with provenance. There is no npm token in this repo.
#
# Normally dispatched by release-please.yml right after release-please
# creates a release. To publish a tag by hand: Actions -> Publish ->
# Run workflow, branch `main`, tag `vX.Y.Z`.
#
# A pushed tag on its own publishes nothing. Before anything reaches npm:
#   - the run must come from main (the npm-publish environment should also
#     allow only main, so an edited copy of this file on another branch
#     cannot get an OIDC token that npm accepts);
#   - the tag must be a vX.Y.Z tag whose commit is on main, and
#     package.json's version must equal it;
#   - a reviewer approves the npm-publish environment;
#   - the job holding id-token: write installs nothing and runs no package
#     scripts: it publishes the tarball the build job produced.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v1.9.6
        required: true
        type: string

permissions: {}

defaults:
  run:
    # bash -eo pipefail: a failing jq in a pipeline fails the step.
    shell: bash

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check where this run comes from and what it publishes
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Publish must run from main, not $GITHUB_REF"
            exit 1
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not a vX.Y.Z release tag"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tagged commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          tagged=$(git rev-parse "refs/tags/${TAG}^{commit}")
          if ! git merge-base --is-ancestor "$tagged" origin/main; then
            echo "::error::$TAG points at $tagged, which is not on main"
            exit 1
          fi

      - name: Verify package.json matches the tag
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::package.json says $version but the tag is $TAG"
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --pack-destination "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing and provenance
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: package
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - name: Require an npm that supports trusted publishing (>= 11.5.1)
        run: |
          npm_version=$(npm --version)
          if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$npm_version"; then
            echo "::error::npm $npm_version cannot use trusted publishing; it needs 11.5.1 or later"
            exit 1
          fi
      - name: Publish to npm
        run: npm publish ./package/*.tgz --provenance --access public
